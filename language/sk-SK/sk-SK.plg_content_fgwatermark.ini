PLG_CONTENT_FGWATERMARK="Obsah - FG Watermark"
PLG_CONTENT_FGWATERMARK_XML_DESCRIPTION="Automaticky vypaľuje obrázkové logo a/alebo textový watermark do obrázkov v obsahu článkov. Watermarkované kópie sa cachujú, originálne súbory sa nikdy nemenia."

PLG_CONTENT_FGWATERMARK_SCOPE_FOLDER_LABEL="Rozsah priečinkov"
PLG_CONTENT_FGWATERMARK_SCOPE_FOLDER_DESC="Watermark sa aplikuje len na obrázky, ktorých cesta začína niektorým z týchto priečinkov (relatívne ku koreňu webu, oddelené čiarkou). Predvolené: images/"

PLG_CONTENT_FGWATERMARK_MIN_WIDTH_LABEL="Minimálna veľkosť (px)"
PLG_CONTENT_FGWATERMARK_MIN_WIDTH_DESC="Obrázky menšie ako táto hodnota (šírka aj výška) sa preskočia, aby sa nevypaľoval watermark do ikoniek."

PLG_CONTENT_FGWATERMARK_CACHE_FOLDER_LABEL="Cache priečinok"
PLG_CONTENT_FGWATERMARK_CACHE_FOLDER_DESC="Kam sa ukladajú vygenerované watermarkované kópie. Ak neexistuje, automaticky sa vytvorí. Musí byť zapisovateľný."

PLG_CONTENT_FGWATERMARK_CACHE_EXPIRY_LABEL="Expirácia cache (sekundy)"
PLG_CONTENT_FGWATERMARK_CACHE_EXPIRY_DESC="0 = nikdy automaticky nevyprší (cache sa aj tak prebuduje pri zmene zdrojového obrázka alebo nastavení pluginu)."

PLG_CONTENT_FGWATERMARK_JPEG_QUALITY_LABEL="Kvalita JPEG výstupu"
PLG_CONTENT_FGWATERMARK_JPEG_QUALITY_DESC="1-100. Platí len pre JPEG výstup."

PLG_CONTENT_FGWATERMARK_FIELDSET_IMAGE="Obrázkový (logo) watermark"
PLG_CONTENT_FGWATERMARK_IMAGE_ENABLE_LABEL="Povoliť obrázkový watermark"
PLG_CONTENT_FGWATERMARK_IMAGE_ENABLE_DESC="Vypáli logo/obrázok na obrázky v obsahu."
PLG_CONTENT_FGWATERMARK_IMAGE_PATH_LABEL="Cesta k logu"
PLG_CONTENT_FGWATERMARK_IMAGE_PATH_DESC="Cesta relatívna ku koreňu webu, napr. images/logo_watermark.png. Odporúča sa PNG s priehľadnosťou. Podporované je aj SVG, vyžaduje si však na serveri PHP rozšírenie Imagick (s podporou SVG/rsvg delegáta) - bez neho sa SVG logo potichu preskočí a do logu sa zapíše upozornenie."
PLG_CONTENT_FGWATERMARK_IMAGE_SCALE_LABEL="Veľkosť loga (% šírky obrázka)"
PLG_CONTENT_FGWATERMARK_IMAGE_SCALE_DESC="Logo sa proporcionálne škáluje na toto percento šírky každého obrázka."
PLG_CONTENT_FGWATERMARK_IMAGE_MAX_UPSCALE_LABEL="Max. zväčšenie loga (násobok)"
PLG_CONTENT_FGWATERMARK_IMAGE_MAX_UPSCALE_DESC="Ak by výpočet zo % šírky obrázka vyžadoval zväčšiť logo nad tento násobok jeho skutočného rozlíšenia, veľkosť sa zhora obmedzí (a zapíše sa upozornenie do logu), aby watermark nebol rozpixelovaný. Napr. 3 = logo sa nikdy nezväčší viac ako 3x oproti nahranému súboru. 0 = bez obmedzenia."
PLG_CONTENT_FGWATERMARK_OPACITY_LABEL="Priehľadnosť (%)"
PLG_CONTENT_FGWATERMARK_IMAGE_OPACITY_DESC="0 = neviditeľné, 100 = plne nepriehľadné."
PLG_CONTENT_FGWATERMARK_MARGIN_LABEL="Okraj (px)"
PLG_CONTENT_FGWATERMARK_IMAGE_MARGIN_DESC="Vzdialenosť od okraja obrázka, v pixeloch."
PLG_CONTENT_FGWATERMARK_IMAGE_POSITION_DESC="Kde sa logo umiestni na obrázku."

PLG_CONTENT_FGWATERMARK_FIELDSET_TEXT="Textový watermark"
PLG_CONTENT_FGWATERMARK_TEXT_ENABLE_LABEL="Povoliť textový watermark"
PLG_CONTENT_FGWATERMARK_TEXT_ENABLE_DESC="Vypáli textový reťazec na obrázky v obsahu."
PLG_CONTENT_FGWATERMARK_TEXT_CONTENT_LABEL="Text watermarku"
PLG_CONTENT_FGWATERMARK_TEXT_CONTENT_DESC="Text, ktorý sa vykreslí na každý obrázok."
PLG_CONTENT_FGWATERMARK_TEXT_FONT_LABEL="Cesta k TTF fontu (voliteľné)"
PLG_CONTENT_FGWATERMARK_TEXT_FONT_DESC="Cesta relatívna ku koreňu webu k .ttf fontu, napr. media/fonts/opensans.ttf. Ak necháte prázdne, použije sa vstavaný bitmapový font (bez podpory diakritiky)."
PLG_CONTENT_FGWATERMARK_TEXT_SIZE_LABEL="Veľkosť písma (px)"
PLG_CONTENT_FGWATERMARK_TEXT_SIZE_DESC="Platí len ak je nastavený TTF font."
PLG_CONTENT_FGWATERMARK_TEXT_COLOR_LABEL="Farba textu"
PLG_CONTENT_FGWATERMARK_TEXT_COLOR_DESC="Farba textu watermarku."
PLG_CONTENT_FGWATERMARK_TEXT_OPACITY_DESC="0 = neviditeľné, 100 = plne nepriehľadné."
PLG_CONTENT_FGWATERMARK_TEXT_MARGIN_DESC="Vzdialenosť od okraja obrázka, v pixeloch."
PLG_CONTENT_FGWATERMARK_TEXT_POSITION_DESC="Kde sa text umiestni na obrázku."

