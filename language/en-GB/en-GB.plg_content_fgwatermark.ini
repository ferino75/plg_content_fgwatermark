PLG_CONTENT_FGWATERMARK="Content - FG Watermark"
PLG_CONTENT_FGWATERMARK_XML_DESCRIPTION="Automatically applies an image logo and/or text watermark to images inside article content. Watermarked copies are cached; original files are never modified."

PLG_CONTENT_FGWATERMARK_SCOPE_FOLDER_LABEL="Scope folder(s)"
PLG_CONTENT_FGWATERMARK_SCOPE_FOLDER_DESC="Only images whose path starts with one of these folders (relative to site root, comma-separated) will be watermarked. Default: images/"

PLG_CONTENT_FGWATERMARK_MIN_WIDTH_LABEL="Minimum size (px)"
PLG_CONTENT_FGWATERMARK_MIN_WIDTH_DESC="Images smaller than this (width and height) are skipped, to avoid watermarking icons."

PLG_CONTENT_FGWATERMARK_CACHE_FOLDER_LABEL="Cache folder"
PLG_CONTENT_FGWATERMARK_CACHE_FOLDER_DESC="Where watermarked copies are stored. Will be created automatically if missing. Must be writable."

PLG_CONTENT_FGWATERMARK_CACHE_EXPIRY_LABEL="Cache expiry (seconds)"
PLG_CONTENT_FGWATERMARK_CACHE_EXPIRY_DESC="0 = never expires automatically (cache is still rebuilt if the source image or the plugin settings change)."

PLG_CONTENT_FGWATERMARK_JPEG_QUALITY_LABEL="JPEG output quality"
PLG_CONTENT_FGWATERMARK_JPEG_QUALITY_DESC="1-100. Applies to JPEG output only."

PLG_CONTENT_FGWATERMARK_FIELDSET_IMAGE="Image (logo) watermark"
PLG_CONTENT_FGWATERMARK_IMAGE_ENABLE_LABEL="Enable image watermark"
PLG_CONTENT_FGWATERMARK_IMAGE_ENABLE_DESC="Overlay a logo image onto content images."
PLG_CONTENT_FGWATERMARK_IMAGE_PATH_LABEL="Logo image path"
PLG_CONTENT_FGWATERMARK_IMAGE_PATH_DESC="Path relative to site root, e.g. images/logo_watermark.png. PNG with transparency recommended. SVG is also supported, but requires the Imagick PHP extension on the server (with SVG/rsvg delegate support) - without it, the SVG logo is silently skipped and a warning is written to the log."
PLG_CONTENT_FGWATERMARK_IMAGE_SCALE_LABEL="Logo size (% of image width)"
PLG_CONTENT_FGWATERMARK_IMAGE_SCALE_DESC="The logo is scaled proportionally to this percentage of each image's width."
PLG_CONTENT_FGWATERMARK_IMAGE_MAX_UPSCALE_LABEL="Max. logo upscale (multiplier)"
PLG_CONTENT_FGWATERMARK_IMAGE_MAX_UPSCALE_DESC="If scaling by image width % would enlarge the logo beyond this multiple of its native resolution, the size is capped (and a warning is logged) to avoid a pixelated watermark. E.g. 3 = logo is never scaled up more than 3x its uploaded resolution. 0 = no limit." 
PLG_CONTENT_FGWATERMARK_OPACITY_LABEL="Opacity (%)"
PLG_CONTENT_FGWATERMARK_IMAGE_OPACITY_DESC="0 = invisible, 100 = fully opaque."
PLG_CONTENT_FGWATERMARK_MARGIN_LABEL="Margin (px)"
PLG_CONTENT_FGWATERMARK_IMAGE_MARGIN_DESC="Distance from the edge of the image, in pixels."
PLG_CONTENT_FGWATERMARK_IMAGE_POSITION_DESC="Where the logo is placed on the image."

PLG_CONTENT_FGWATERMARK_FIELDSET_TEXT="Text watermark"
PLG_CONTENT_FGWATERMARK_TEXT_ENABLE_LABEL="Enable text watermark"
PLG_CONTENT_FGWATERMARK_TEXT_ENABLE_DESC="Overlay a text string onto content images."
PLG_CONTENT_FGWATERMARK_TEXT_CONTENT_LABEL="Watermark text"
PLG_CONTENT_FGWATERMARK_TEXT_CONTENT_DESC="The text drawn onto each image."
PLG_CONTENT_FGWATERMARK_TEXT_FONT_LABEL="TTF font file path (optional)"
PLG_CONTENT_FGWATERMARK_TEXT_FONT_DESC="Path relative to site root to a .ttf font, e.g. media/fonts/opensans.ttf. Leave empty to use a built-in bitmap font (no diacritics support)."
PLG_CONTENT_FGWATERMARK_TEXT_SIZE_LABEL="Font size (px)"
PLG_CONTENT_FGWATERMARK_TEXT_SIZE_DESC="Only applies when a TTF font is set."
PLG_CONTENT_FGWATERMARK_TEXT_COLOR_LABEL="Text colour"
PLG_CONTENT_FGWATERMARK_TEXT_COLOR_DESC="Colour of the watermark text."
PLG_CONTENT_FGWATERMARK_TEXT_OPACITY_DESC="0 = invisible, 100 = fully opaque."
PLG_CONTENT_FGWATERMARK_TEXT_MARGIN_DESC="Distance from the edge of the image, in pixels."
PLG_CONTENT_FGWATERMARK_TEXT_POSITION_DESC="Where the text is placed on the image."

PLG_CONTENT_FGWATERMARK_POSITION_LABEL="Position"
PLG_CONTENT_FGWATERMARK_POS_TL="Top left"
PLG_CONTENT_FGWATERMARK_POS_TC="Top centre"
PLG_CONTENT_FGWATERMARK_POS_TR="Top right"
PLG_CONTENT_FGWATERMARK_POS_CL="Centre left"
PLG_CONTENT_FGWATERMARK_POS_CC="Centre"
PLG_CONTENT_FGWATERMARK_POS_CR="Centre right"
PLG_CONTENT_FGWATERMARK_POS_BL="Bottom left"
PLG_CONTENT_FGWATERMARK_POS_BC="Bottom centre"
PLG_CONTENT_FGWATERMARK_POS_BR="Bottom right"
